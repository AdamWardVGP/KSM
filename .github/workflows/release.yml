name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract version
        run: |
          echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Decode signing key
        # SIGNING_KEY is stored as base64 in GitHub secrets to avoid multiline handling issues.
        # Decoded here and set as a multiline env var for vanniktech to read.
        run: |
          echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish to Maven Central
        env:
          # ORG_GRADLE_PROJECT_* maps env vars to Gradle project properties.
          # The property names (mavenCentralUsername, signingInMemoryKey, etc.)
          # are hardcoded in the vanniktech maven-publish plugin and must match exactly.
          # See: https://vanniktech.github.io/gradle-maven-publish-plugin/central-portal/
          # The secret names on the right are our GitHub repository secrets.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :ksm:publishAndReleaseToMavenCentral :ksm-ir-plugin:publishAndReleaseToMavenCentral --no-configuration-cache
