name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Run Detekt
        run: ./gradlew detekt
      - name: Run KSM tests
        run: ./gradlew :ksm:jvmTest
      - name: Publish KSM to local Maven
        run: ./gradlew :ksm:publishToMavenLocal
      - name: Publish IR plugin to local Maven
        run: ./gradlew :ksm-ir-plugin:publishToMavenLocal
      - name: Run IR plugin tests
        run: ./gradlew :ksm-ir-plugin:test