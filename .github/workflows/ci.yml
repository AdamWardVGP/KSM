name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish IR plugin to local Maven
        run: ./gradlew :ksm-ir-plugin:publishToMavenLocal
      - name: Run tests
        run: ./gradlew :ksm:jvmTest